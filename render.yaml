# Free web service for the UNTANGLE API.
# plan: free is required. If this field is omitted, Render's blueprint default
# for a new web service is the paid plan 0.5c-512mb.
# This file has no secret values. FRONTEND_ORIGIN is the live Vercel origin.
# A persistent disk is not included: free web services cannot attach one.
# Repo root is the service root (not backend/). See docs/deployment.md.

services:
  - type: web
    name: untangle-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm ci --prefix tools/layout
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      # false so a visitor can upload a PDF and an Excel IO list.
      # true would refuse every upload and only show a synthetic project.
      - key: PUBLIC_DEMO_MODE
        value: "false"
      - key: DEMO_SEED_PROCESS
        value: "false"
      - key: OCR_IN_BUILD
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/untangle.db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/data/uploads
      - key: CACHE_DIR
        value: /opt/render/project/src/data/cache
      - key: MAX_UPLOAD_MB
        value: "50"
      # Extra origins only (local Vite). FRONTEND_ORIGIN is always allowed too.
      - key: CORS_ORIGINS
        value: http://127.0.0.1:5173
      # Exact Vercel production origin. https, no path, no trailing slash. Never *.
      - key: FRONTEND_ORIGIN
        value: https://untangle-coral.vercel.app
      # Optional gate. Leave blank so visitors are not asked for a code. Never commit a real code.
      - key: DEMO_ACCESS_CODE
        sync: false
